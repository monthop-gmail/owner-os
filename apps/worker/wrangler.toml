name = "owner-os-worker"
main = "src/index.ts"
compatibility_date = "2026-10-19"

# Local-only placeholder; the real database_id is set when the D1 database is created.
[[d1_databases]]
binding = "DB"
database_name = "owner-os"
database_id = "00000000-0000-0000-0000-000000000000"
